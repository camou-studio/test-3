<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="camou — Gleiche Fragen. Neue Perspektiven.">
  <title>camou — independent artist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module" src="script.js"></script>
</head>

<body>
  <main class="experience">

    <header class="topbar">
      <a class="logo" href="#" id="logo">camou<span>.</span></a>

      <nav class="navigation" aria-label="Hauptnavigation">
        <button class="nav-link active" data-section="0">Home</button>
        <button class="nav-link" data-section="1">Music</button>
        <button class="nav-link" data-section="2">Visuals</button>
        <button class="nav-link" data-section="3">Echoes</button>
        <button class="nav-link" data-section="4">Contact</button>
      </nav>

      <div class="top-note">
        INDEPENDENT ARTIST
      </div>
    </header>

    <section class="globe-stage" aria-label="Drehbare Camou-Kugel">

      <div id="globe"></div>
      <!-- Native Eingabe nur während der Bearbeitung, Kugeltextur bleibt sichtbar. -->
      <div class="contact-editor" id="contact-editor" hidden>
        <form class="contact-editor-box" id="contact-editor-form">
          <label for="contact-editor-input" id="contact-editor-label">Eingabe</label>
          <input id="contact-editor-input" autocomplete="off">
          <textarea id="contact-editor-textarea" rows="5" hidden></textarea>
          <div class="contact-editor-actions">
            <button type="button" id="contact-editor-cancel">Abbrechen</button>
            <button type="submit">Übernehmen</button>
          </div>
        </form>
      </div>

      <!-- Der Spotify-Player liegt direkt auf dem Bildrahmen der Kugel. -->
      <div class="music-frame-on-globe" id="music-frame-on-globe" hidden>
        <iframe id="music-spotify-frame"
          title="b3nn3t – Spotify Künstler und Songs"
          src="https://open.spotify.com/embed/artist/7pajHvUWNCnOPhDPyH4M6x?theme=0"
          loading="eager"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>

      <div class="zoom-controls" aria-label="Zoom">
        <button id="zoom-in" aria-label="Vergrößern">+</button>
        <button id="zoom-out" aria-label="Verkleinern">−</button>
        <button id="zoom-reset" aria-label="Zoom zurücksetzen">↺</button>
      </div>

      <div class="interaction-hint" id="hint">
        <span class="hint-dot"></span>
        DRAG TO EXPLORE
      </div>

      <div class="section-indicator">
        <span id="current-section">HOME</span>
        <span class="indicator-line"></span>
        <span id="section-number">01 / 05</span>
      </div>

    </section>

    <footer class="footer">
      <a class="footer-impressum" href="impressum.html">Impressum</a>
      <span class="footer-signature">camou — independent artist</span>
    </footer>

  </main>
</body>
</html>
